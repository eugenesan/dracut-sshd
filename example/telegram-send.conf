# copy to e.g. /root/.telegram_bot
#
# Telegram bot credentials for the telegram-send dracut module (47telegram-send).
# This file is sourced as a shell script, so it is KEY="value" lines, not INI.
#
# TOKEN    the bot token, from @BotFather (https://t.me/BotFather)
# CHAT_ID  the chat to post to; for a private chat, message the bot once and
#          read the chat id out of https://api.telegram.org/bot<TOKEN>/getUpdates
# MESSAGE  default text, used when telegram-send runs with no argument
#
# The values below are placeholders and will not work.
#
# Create this file BEFORE running update-initramfs: the module's check() looks
# for it at image build time and silently leaves itself out of the initramfs if
# it is missing, so the other modules still install and you get no notification
# and no error beyond a "No telegram bot token file found" from dracut.
#
# The file is copied into the image as /root/.telegram_bot, mode 0600, so the
# script can read it during early boot. That puts the bot token on disk in the
# initramfs: anyone who can read the image can use the bot. Prefer a bot that
# only talks to you, and rotate the token if the image leaks.
#
# To test it outside the initramfs:
#     # cp /root/.telegram_bot /tmp/ && TELEGRAM_CONF=/tmp/.telegram_bot telegram-send "hello"
#
# See also readme.dracut-modules.txt for the TELEGRAM_* knobs that tune when
# and how often a notification is sent.

TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
CHAT_ID="12345678"
MESSAGE="Hello"