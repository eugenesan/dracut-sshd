# copy to e.g. /etc/dracut.conf.d/90-sshd-ubuntu.conf
#
# NB: a complete configuration for the Ubuntu image - it brings up the
# networking itself, so it replaces the other examples in this directory
# rather than being combined with them. Copy one file, not several.
#
# Dracut configuration for dracut-sshd: remote SSH access to a machine that
# boots without a usable network, plus a Telegram notification once the
# network comes up.
#
# Modules:
#   bash                     /bin/bash, needed by telegram-send's shebang
#   systemd-cryptsetup       unlock an encrypted root
#   url-lib                  curl(1) + SSL CA bundle (telegram-send talks HTTPS)
#   network                  base networking (systemd-networkd, DHCP, ip(8))
#   netplan                  Ubuntu network configuration
#   network-manager          NetworkManager based configuration
#   network-manager-wireless wifi + wpa_supplicant drivers
#   sshd                     this package's SSH access
#   telegram-send            boot notification via the Telegram bot API
kernel_cmdline="rd.neednet=1"
add_dracutmodules+=" bash systemd-cryptsetup url-lib network netplan network-manager network-manager-wireless sshd telegram-send "

# Extra tools in the initramfs, on top of what the modules above already pull
# in. Deliberately minimal and all for debugging a rescue shell; nothing in the
# image depends on them. tail(1) is here for following the telegram-send log:
#
#     tail -f /run/telegram-send.log
#
# while the network is still coming up (rd.break, or init=/bin/bash). It is
# coreutils and no dracut module installs it - unlike readlink and sleep, which
# 80base provides for free.
#
# Removed as redundant:
#   readlink   already installed by dracut's 80base module (always included)
#   basename   only telegram-send 0.4 needed it; v0.6 uses bash builtins
#   date       ditto - v0.6 formats timestamps with printf '%(...)T'
#   ifconfig   never used: the external IP comes from curl (api.ipify.org),
#              and ip(8) is installed by the 45net-lib module
install_items+=" nano ping ping6 tail top "
